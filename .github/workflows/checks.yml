name: Static checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node tests/behavior-chart-symbol.cjs
      - run: node tests/behavior-live.cjs
      - run: node --test tests/claude-bridge.test.cjs

