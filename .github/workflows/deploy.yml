name: Deploy CRYPTOSCOPE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  browser-market:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test driver
        run: npm install --prefix "$RUNNER_TEMP/browser-driver" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Check partial catalogue in desktop and mobile Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: NODE_PATH="$RUNNER_TEMP/browser-driver/node_modules" node tests/browser-market-partial.cjs
  deploy:
    needs: browser-market
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: node --check assets/app.js
      - name: Run static smoke checks
        run: node tests/smoke.cjs
      - name: Run market behavior checks
        run: |
          node tests/behavior-chart-symbol.cjs
          node tests/behavior-live.cjs
          node --test tests/behavior-market-retry.cjs
          node --test tests/behavior-market-partial.cjs
          node --test tests/behavior-research.cjs
          node --test tests/f1-research-stale-catalogue.cjs tests/f6-research-empty-market-data.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare restricted public artifact
        run: |
          mkdir -p public/assets
          cp index.html public/index.html
          cp assets/app.js assets/styles.css public/assets/
          touch public/.nojekyll
          if grep -q 'id="language"' public/index.html; then echo 'ERROR: language selector still present'; exit 1; fi
          if grep -q 'English</option>' public/index.html; then echo 'ERROR: English option still present'; exit 1; fi
          if grep -Eq 'const extras=|},en:\{' public/assets/app.js; then echo 'ERROR: non-Russian localization remains'; exit 1; fi
          if grep -q 'localization.js' public/index.html; then echo 'ERROR: localization script still linked'; exit 1; fi
          echo "Publishing commit $GITHUB_SHA (Russian-only)"
          grep -o 'assets/app.js?v=[^" ]*' public/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
